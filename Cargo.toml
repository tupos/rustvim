[workspace]
resolver = "2"

members = [
  "src/nvim/rust_os",
  "src/nvim/rustvim_core",
  "src/nvim/rustvim_lib",
]

[workspace.dependencies]
libc = "0.2"

[profile.release-lto]
inherits = "release"
lto = true

[profile.strip-release]
inherits = "release"
lto = true

[profile.strip-release-lto]
inherits = "release"
lto = true
strip = "symbols"
