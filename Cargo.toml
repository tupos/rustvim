[workspace]
resolver = "2"

members = [
  "src/nvim/rust_os",
  "src/nvim/rustvim_core",
  "src/nvim/rustvim_lib",
]

[workspace.dependencies]
libc = "0.2"

[profile.release-debinfo]
inherits = "release"
debug = true
lto = false

[profile.release-debinfo-lto]
inherits = "release-debinfo"
lto = true

[profile.release-lto]
inherits = "release"
lto = true

[profile.strip-release]
inherits = "release"
lto = false
strip = "symbols"

[profile.strip-release-lto]
inherits = "strip-release"
lto = true
