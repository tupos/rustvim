[workspace]
resolver = "2"

members = [
  "src/nvim/rust_os",
  "src/nvim/rustvim_core",
  "src/nvim/rustvim_lib",
  "src/nvim/rustvim_tracing",
]

[workspace.dependencies]
libc = "0.2"
thiserror = "2.0.21"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = {
  version = "0.3.23",
  default-features = false,
  features = ["registry"],
}

[profile.release-debinfo]
inherits = "release"
debug = true
lto = false

[profile.release-debinfo-lto]
inherits = "release-debinfo"
lto = true

[profile.release-lto]
inherits = "release"
lto = true

[profile.strip-release]
inherits = "release"
lto = false
strip = "symbols"

[profile.strip-release-lto]
inherits = "strip-release"
lto = true
