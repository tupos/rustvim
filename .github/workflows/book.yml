name: book
on:
  push:
    branches: [master]
    paths:
      - 'docs/rustvim-book/**'
      - '.github/workflows/book.yml'
  pull_request:
    branches: [master]
    paths:
      - 'docs/rustvim-book/**'
      - '.github/workflows/book.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MDBOOK_VERSION: '0.5.4'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        if: github.repository == 'tupos/rustvim' && github.ref == 'refs/heads/master'
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Install mdBook
        shell: bash
        run: |
          set -euo pipefail
          mdbook_archive="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --retry 5 \
            --output "$RUNNER_TEMP/$mdbook_archive" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/$mdbook_archive"
          mkdir -p "$RUNNER_TEMP/mdbook"
          tar -xzf "$RUNNER_TEMP/$mdbook_archive" -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/mdbook/mdbook" --version

      - name: Build book
        env:
          MDBOOK_OUTPUT__HTML__SITE_URL: ${{ steps.pages.outputs.base_path }}/
        run: mdbook build docs/rustvim-book

      - name: Upload Pages artifact
        if: github.repository == 'tupos/rustvim' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/rustvim-book/book

  deploy:
    if: github.repository == 'tupos/rustvim' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy book
        id: deployment
        uses: actions/deploy-pages@v5.0.1
