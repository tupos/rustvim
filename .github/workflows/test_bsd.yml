name: test-bsd

on:
  push:
    branches:
      - 'master'
      - 'release-[0-9]+.[0-9]+'
  pull_request:
    branches:
      - 'master'
      - 'release-[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          usesh: true
          cache-after-prepare: true
          prepare: |
            set -eu
            pkg install -y cmake gmake ninja unzip wget gettext python git rustup-init
            rustup-init -y --no-modify-path --default-toolchain none
          run: |
            set -eu
            . "$HOME/.cargo/env"
            gmake rust-toolchain
            rustc --version
            cargo --version
            gmake deps
            gmake CMAKE_EXTRA_FLAGS="-DCI_BUILD=ON" nvim
            ./build/bin/nvim --version
            RUST_TEST_THREADS=1 gmake rusttest

  openbsd:
    name: OpenBSD
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945 # v1.4.8
        with:
          usesh: true
          cache-after-prepare: true
          prepare: |
            set -eu
            pkg_add -I cmake gmake ninja gettext-tools gettext-runtime git rust
          run: |
            set -eu
            rustc --version
            cargo --version
            gmake deps
            gmake CMAKE_EXTRA_FLAGS="-DCI_BUILD=ON" nvim
            ./build/bin/nvim --version
            RUST_TEST_THREADS=1 gmake rusttest
